<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>content</title>
    <link rel="stylesheet" href="content.css">
</head>
<body>
    
    <section id="content" >

        <div class="content">

            <div class="content-title">
                
                <h2>Let's Work Together</h2>

                <p>Ready to bring your vision to life? Let's discuss how we can create something amazing together. I'm always excited to
                    take on new challenges and collaborate on innovative projects.</p>
            </div>

            <form class="content-form">

                <div class="form-row">
                    <div class="form-group">
                        <label for="#">Name</label>
                        <input type="text" id="name" name="name" placeholder="your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="#">Email</label>
                        <input type="email" id="email" name="email" placeholder="youremail@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="#">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="what's this about" required>
                </div>
                <div class="form-group">
                    <label for="#">message</label>
                    <textarea name="message" id="message" rows="6" placeholder="Tell me about your project ..." required></textarea>
                </div>

                <button class="btn" type="submit">Send Message</button>
            </form>
        </div>
    
        
    
    
    </section>

</body>
</html>
